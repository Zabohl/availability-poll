<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Group Availability</title>
<meta name="description" content="Plan events around everyone's schedule. Invite people, collect availability week by week, and pick dates that work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky top bar; content column up to 1320px; event pages use a 2-column dashboard
   (main + side) that stacks on phones. Ink-blue is the brand accent so that green, red and
   amber stay reserved for availability. */
:root{
  --bg:#f3f4f7;--fg:#15171c;--muted:#5b6170;--line:#dcdfe6;--card:#ffffff;--soft:#eceef3;
  --accent:#3346b8;--accent-fg:#ffffff;--accent-soft:#e6e9fb;
  --free:#2c8a56;--busy:#d2463a;--unsure:#c98a0c;--none:#c6cad3;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pop:0 10px 28px rgba(18,22,40,.16);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101217;--fg:#e8eaf0;--muted:#9aa1b0;--line:#2b303a;--card:#181b22;--soft:#21252d;--accent:#8c9cff;--accent-fg:#0c1033;--accent-soft:#252b4d;--free:#4cc489;--busy:#f06a5a;--unsure:#f0b545;--none:#3a3f4a;--pop:0 10px 28px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101217;--fg:#e8eaf0;--muted:#9aa1b0;--line:#2b303a;--card:#181b22;--soft:#21252d;--accent:#8c9cff;--accent-fg:#0c1033;--accent-soft:#252b4d;--free:#4cc489;--busy:#f06a5a;--unsure:#f0b545;--none:#3a3f4a;--pop:0 10px 28px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
[hidden]{display:none!important}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;text-wrap:balance;font-weight:750;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
h3{font-size:14px;margin:0 0 6px;font-weight:700}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:20px 48px;min-width:0}
.narrow{max-width:760px}
.sub{color:var(--muted);margin:0 0 14px}
.lbl{font-size:12px;color:var(--muted)}
.msg{color:var(--muted);font-size:13px;margin:6px 0 0}
.err{color:var(--busy)}
.ok{color:var(--free)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.card>h2:first-child{margin-bottom:12px}

/* controls */
button,.btn{font:inherit;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;min-height:38px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
button[disabled]{opacity:.5;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.primary:hover{border-color:var(--accent);filter:brightness(1.07)}
.ghost{background:transparent}
.danger{color:var(--busy);border-color:color-mix(in srgb,var(--busy) 45%,var(--line))}
.sm{min-height:32px;padding:4px 10px;font-size:13px}
button.link{background:none;border:none;padding:0;min-height:0;color:var(--accent);text-decoration:underline;font-size:13px;font-weight:600}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:90px;resize:vertical}
select{padding:4px 8px;min-height:34px}
select:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;margin:0 0 12px}
.field>.lbl{font-weight:600;color:var(--fg);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.check,.radio{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:0 0 10px;cursor:pointer}
.check input,.radio input{width:auto;min-height:0;margin-top:4px;accent-color:var(--accent)}
.check small,.radio small{display:block;color:var(--muted);font-size:12px}
fieldset{border:none;padding:0;margin:0 0 6px}
legend{font-weight:700;font-size:14px;margin-bottom:8px;padding:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--card)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--fg);text-decoration:none;font-size:16px;white-space:nowrap;letter-spacing:-.01em}
.brand i{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand i b{width:7px;height:7px;border-radius:2px;background:var(--free)}
.brand i b:nth-child(2),.brand i b:nth-child(6){background:var(--busy)}
.brand i b:nth-child(4){background:var(--accent)}
.navlinks{display:flex;gap:4px;flex:1;min-width:0}
.navlinks a{padding:8px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.navlinks a:hover{color:var(--fg)}
.navlinks a.on{color:var(--accent);background:var(--accent-soft)}
.navright{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;padding:0;min-height:0;overflow:hidden;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:62px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);min-width:250px;padding:6px;z-index:30}
.menu .who{padding:10px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.menu .who span{font-size:12px;color:var(--muted);word-break:break-all}
.menu button{display:flex;justify-content:flex-start;width:100%;border:none;background:none;border-radius:8px;font-weight:500}
.menu button:hover{background:var(--soft)}
@media (max-width:560px){.hide-sm{display:none!important}}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:44px;align-items:center;padding-block:44px 28px}
.hero h1{font-size:clamp(32px,5.4vw,54px);line-height:1.04;letter-spacing:-.03em;margin-bottom:16px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 22px}
.hero .primary{font-size:16px;padding:12px 22px}
.invitecard{border-left:4px solid var(--accent);padding-left:14px;margin:0 0 18px}
.invitecard .from{font-size:13px;color:var(--muted)}
.invitecard blockquote{margin:8px 0 0;font-size:15px;white-space:pre-line}
.demo{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.demo .t{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.demo .sd{aspect-ratio:1;min-height:0;cursor:default}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;padding-block:8px 24px}
.features .card h3{font-size:15px}
.features .card p{margin:0;color:var(--muted);font-size:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:24px;padding-top:24px}}

/* home */
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
a.ev{display:grid;gap:8px;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
a.ev:hover{border-color:var(--accent)}
a.ev h3{margin:0;font-size:17px}
a.ev .meta{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.go{background:color-mix(in srgb,var(--free) 18%,var(--card));color:var(--fg)}
.chip.todo{background:color-mix(in srgb,var(--unsure) 22%,var(--card));color:var(--fg)}
.chip.no{background:color-mix(in srgb,var(--busy) 15%,var(--card));color:var(--fg)}
.empty{text-align:center;padding:44px 16px}

/* event header + layout */
.crumb{font-size:13px;margin-bottom:10px;display:inline-block;font-weight:600;text-decoration:none}
.ehead{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start}
.ehead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin:4px 0 12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0;overflow-x:auto}
.tabs a{padding:10px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;font-weight:600;white-space:nowrap}
.tabs a.on{color:var(--fg);border-color:var(--accent)}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.dash>div{min-width:0}
.win>button.main span{overflow-wrap:anywhere}
.prompt{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:14px;padding:18px;margin-bottom:14px}
.prompt h2{margin-bottom:4px}
.prompt blockquote{margin:10px 0;padding-left:12px;border-left:3px solid var(--accent);white-space:pre-line}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.statuslist{display:grid;gap:10px}
.st{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.st .k{font-size:12px;color:var(--muted)}
.st .v{font-weight:700}
.st .v.ok{color:var(--free)} .st .v.no{color:var(--busy)} .st .v.todo{color:var(--unsure)}
.group{margin-bottom:12px}
.group h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.plist{display:grid;gap:6px}
.person{display:flex;align-items:center;gap:10px;font-size:14px}
.person .av{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.person .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .tag{margin-left:auto}
.upd{border-top:1px solid var(--line);padding:12px 0}
.upd:first-of-type{border-top:none}
.upd .by{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.upd p{margin:6px 0 0;white-space:pre-line}

/* status colors */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
i.st-open{background:var(--free)}
i.st-partial{background:linear-gradient(135deg,var(--free) 50%,var(--busy) 50%)}
i.st-tentative{background:repeating-linear-gradient(45deg,var(--unsure) 0 3px,color-mix(in srgb,var(--unsure) 25%,var(--card)) 3px 6px)}
i.st-na{background:var(--busy)}
i.st-none{background:var(--none)}

/* month cards */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px;align-items:stretch}
.months>.card{margin-bottom:0}
.mhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead h2{margin:0;line-height:34px}
.mset{display:flex;align-items:center;gap:8px;margin:0}
.mset .lbl{white-space:nowrap}
.mset select{width:auto;min-width:140px}
.mdetail{display:grid;gap:4px;margin:0 0 12px}
.cal{display:grid;grid-template-columns:52px minmax(96px,128px) repeat(7,minmax(0,1fr));gap:6px 4px;align-items:start}
.hd{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;line-height:16px;font-weight:600}
.hd.l{text-align:left}
.hd .s1{display:none}
@media (max-width:520px){.hd .lg{display:none}.hd .s1{display:inline}}
.wk{font-size:13px;font-weight:700;line-height:34px;white-space:nowrap}
.ws select{font-size:13px}
.d{height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}
.d.out{opacity:.45}
.d.off{opacity:.18;background:transparent!important;border-style:dotted!important}
.d.st-none{background:color-mix(in srgb,var(--none) 55%,var(--card));border-color:var(--none)}
.d.st-open{background:color-mix(in srgb,var(--free) 32%,var(--card));border-color:color-mix(in srgb,var(--free) 60%,var(--card))}
.d.st-tentative{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--unsure) 45%,var(--card)) 0 4px,color-mix(in srgb,var(--unsure) 12%,var(--card)) 4px 8px);border-color:color-mix(in srgb,var(--unsure) 60%,var(--card))}
.d.st-na{background:color-mix(in srgb,var(--busy) 30%,var(--card));border-color:color-mix(in srgb,var(--busy) 55%,var(--card))}
.d.st-partial{background:color-mix(in srgb,var(--busy) 24%,var(--card));border:1.5px dashed var(--busy)}
.d.st-partial.pk{background:color-mix(in srgb,var(--free) 36%,var(--card));border:1.5px dashed var(--free);font-weight:700}
.cal button.d{min-height:0;padding:0;font-size:11px;cursor:pointer;color:var(--fg);font-weight:500}
.cal button.d.tap{height:38px}
.hint{grid-column:3 / -1;font-size:11px;color:var(--muted);margin-top:-4px}
.wdetail{grid-column:2 / -1;display:grid;gap:4px}
.tdate{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tdate input{width:auto;max-width:170px;min-height:32px;padding:4px 8px;font-size:13px}
.save{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;z-index:5}

/* summary */
.sumcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sd{position:relative;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:4px 6px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--fg);font-size:12px;font-weight:500;min-width:0}
.sd .n{font-weight:700;text-align:left}
.sd .b{align-self:flex-end;font-size:12px;font-weight:800;line-height:1}
.sd.blank{visibility:hidden}
.sd.out{opacity:.6}
.sd.dim{opacity:.25}
.sd.c-none{background:color-mix(in srgb,var(--none) 45%,var(--card))}
.sd.c-open{background:color-mix(in srgb,var(--free) 26%,var(--card));border-color:color-mix(in srgb,var(--free) 50%,var(--card))}
.sd.c-all{background:color-mix(in srgb,var(--free) 52%,var(--card));border-color:var(--free)}
.sd.c-tent{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--unsure) 40%,var(--card)) 0 4px,color-mix(in srgb,var(--unsure) 10%,var(--card)) 4px 8px);border-color:color-mix(in srgb,var(--unsure) 55%,var(--card))}
.sd.c-busy{background:color-mix(in srgb,var(--busy) var(--lv,30%),var(--card));border-color:color-mix(in srgb,var(--busy) 55%,var(--card))}
.sd.final{box-shadow:inset 0 -4px 0 var(--accent)}
.sd.hl{outline:3px solid var(--accent);outline-offset:1px;z-index:1}
.sd.sel{outline:2px dashed var(--fg);outline-offset:2px;z-index:2}
.tip{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:10px 12px;max-width:290px;font-size:13px;pointer-events:none}
.tip h4{margin:0 0 6px;font-size:13px}
.tip .grp{margin-top:6px}
.tip .grp b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tip .grp div{margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{min-height:32px;padding:4px 12px;font-size:13px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wins{display:grid;gap:8px}
.win{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.win.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.win>button.main{flex:1;border:none;border-radius:0;justify-content:flex-start;text-align:left;display:grid;gap:2px;font-weight:500;min-width:0;background:transparent}
.win .r{font-weight:700}
.win .s{font-size:13px;color:var(--muted)}
.win>button.set{border:none;border-left:1px solid var(--line);border-radius:0;font-size:13px;color:var(--accent);white-space:nowrap;background:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right}
.scroll{overflow-x:auto}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);min-width:80px}
.bar i{display:block;height:100%}

/* members */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.mrow .who{min-width:0}
.mrow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .who span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.mrow select{width:auto}
@media (max-width:560px){.mrow{grid-template-columns:1fr auto}.mrow .who{grid-column:1 / -1}}

/* modal + picker */
.modal-back{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:50;display:grid;place-items:start center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);padding:20px;box-shadow:var(--pop)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal .x{border:none;background:none;font-size:22px;line-height:1;min-height:0;padding:4px 8px;color:var(--muted)}
.preview{background:var(--soft);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;max-height:200px;overflow:auto;margin:0}
.picker{position:relative}
.pbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--card);min-height:44px;cursor:text}
.pbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pchips{display:contents}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;max-width:100%}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip button{border:none;background:none;min-height:0;padding:0 6px;font-size:16px;line-height:1;color:var(--muted)}
.pin{border:none!important;box-shadow:none!important;flex:1;min-width:160px;min-height:30px;padding:2px 4px}
.pdd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);z-index:60;max-height:260px;overflow:auto;padding:4px}
.popt{padding:8px 10px;border-radius:8px;cursor:pointer;display:grid;font-size:14px}
.popt span{font-size:12px;color:var(--muted)}
.popt.on,.popt:hover{background:var(--soft)}
.pempty{padding:8px 10px;font-size:13px;color:var(--muted)}

/* v4: header chips, timeline, plan links, organizer pages, itinerary */
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.hchip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.hchip.strong{color:var(--fg);font-weight:700}
.hchip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.timeline{list-style:none;display:flex;gap:0;margin:18px 0 20px;padding:0;overflow-x:auto}
.timeline li{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;position:relative;padding-right:10px;font-size:13px;color:var(--muted)}
.timeline li:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);min-width:12px}
.timeline li.done:not(:last-child)::after{background:var(--accent)}
.timeline .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);flex:none;border:2px solid var(--line)}
.timeline li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.timeline li.now .dot{background:var(--card);border-color:var(--accent);color:var(--accent)}
.timeline li.now .tl{color:var(--fg);font-weight:700}
.timeline li.done .tl{color:var(--fg)}
.timeline .tl{white-space:nowrap}
.timeline button.tl{background:none;border:none;padding:0;min-height:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pagetitle{font-size:18px;margin:0 0 12px}
.alinks{display:grid;gap:0;margin-top:6px;border-top:1px solid var(--line)}
.alink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;text-decoration:none;color:var(--accent);text-align:left;width:100%;min-height:0;font-weight:500}
.alink:hover{background:var(--soft);border-color:var(--line)}
.alink b{display:block;font-weight:700}
.alink small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.alink.todo small{color:var(--unsure)}
.todo-text{color:var(--unsure)}
.section{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sh{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subnav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card)}
.subnav a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.checklist{display:grid;gap:10px}
.ck{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ck .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);flex:none}
.ck.done .dot{background:var(--accent);color:var(--accent-fg)}
.ck.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ck.now .dot{background:var(--accent-soft);color:var(--accent)}
.ckb{min-width:0;flex:1}
.iday{margin-bottom:12px}
.ihead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.itime{font-size:12px;font-weight:700;color:var(--accent);min-width:64px;padding-top:2px;font-variant-numeric:tabular-nums}
.ibody{flex:1;min-width:0}
.ibody b{display:block}
.ibody p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.iform{background:var(--soft);border-radius:10px;padding:12px;margin:6px 0}
a.btn.sm{font-size:13px}
@media (prefers-reduced-motion:no-preference){a.ev,.sd,button{transition:border-color .15s,background-color .15s}}
</style>

<body>
<header class="top" id="top"></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div class="tip" id="tip" hidden></div>
<script>
(function () {
  "use strict";
  // ---------- constants & helpers ----------
  var STATUS = [["open", "Free"], ["partial", "Set days"], ["tentative", "Not Sure Yet"], ["na", "Busy"]];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var ST_CLS = { open: "st-open", partial: "st-partial", tentative: "st-tentative", na: "st-na" };
  var PRIVACY = {
    everyone: ["Everyone sees details", "Everyone in the event can see who is free or busy on each day."],
    organizers: ["Organizers see details", "Organizers see who is free or busy. Guests see totals per day only."],
    counts: ["Totals only", "Nobody sees who is busy on which day, only how many. Each person sees their own answers."]
  };
  var DAY = 864e5;
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function d2s(t) { var d = new Date(t); return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()); }
  function ts(key) { var p = key.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2] || 1); }
  function fmtRange(t) {
    var a = new Date(t), b = new Date(t + 6 * DAY);
    return MON[a.getUTCMonth()] + " " + a.getUTCDate() + " – " + (a.getUTCMonth() === b.getUTCMonth() ? "" : MON[b.getUTCMonth()] + " ") + b.getUTCDate();
  }
  function fmtDate(iso, withDow) {
    if (!iso) return "";
    var d = new Date(ts(iso));
    return (withDow ? DOW[(d.getUTCDay() + 6) % 7] + ", " : "") + MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
  }
  function fmtShort(iso) { var d = new Date(ts(iso)); return DOW[(d.getUTCDay() + 6) % 7] + " " + MON[d.getUTCMonth()] + " " + d.getUTCDate(); }
  function fmtSpan(a, b) {
    if (!a) return "";
    var x = new Date(ts(a)), y = new Date(ts(b));
    if (a === b) return fmtDate(a, true);
    if (x.getUTCFullYear() === y.getUTCFullYear()) return MON[x.getUTCMonth()] + " " + x.getUTCDate() + " – " + (x.getUTCMonth() === y.getUTCMonth() ? "" : MON[y.getUTCMonth()] + " ") + y.getUTCDate() + ", " + y.getUTCFullYear();
    return fmtDate(a) + " – " + fmtDate(b);
  }
  function fmtBlockAdj(n) { n = +n || 1; return n % 7 === 0 ? (n / 7) + "-week" : n + "-day"; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
  function cleanDays(a) {
    var out = [];
    (a || []).forEach(function (i) { i = +i; if (i >= 0 && i < 7 && out.indexOf(i) < 0) out.push(i); });
    return out.sort();
  }
  function initials(n) { return String(n || "?").trim().split(/[\s@.]+/).filter(Boolean).map(function (w) { return w.charAt(0); }).slice(0, 2).join("").toUpperCase() || "?"; }
  function ago(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 86400 * 7) return Math.floor(s / 86400) + " d ago";
    var d = new Date(iso); return MON[d.getMonth()] + " " + d.getDate();
  }
  var EMAIL_RE = /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;

  // Weeks (Mon–Sun) covering [start, end]; a week belongs to its Thursday's month
  // (or its first in-range day's month when that Thursday is outside the range).
  function buildCal(start, end) {
    var s = ts(start), e = ts(end), dow = (new Date(s).getUTCDay() + 6) % 7;
    var months = [], by = {};
    for (var t = s - dow * DAY; t <= e; t += 7 * DAY) {
      var thu = t + 3 * DAY, anchor = thu < s || thu > e ? Math.max(t, s) : thu;
      var ad = new Date(anchor), mk = ad.getUTCFullYear() + "-" + p2(ad.getUTCMonth() + 1);
      if (!by[mk]) { by[mk] = { key: mk, label: MON[ad.getUTCMonth()] + " " + ad.getUTCFullYear(), long: MONL[ad.getUTCMonth()] + " " + ad.getUTCFullYear(), m: ad.getUTCMonth(), weeks: [] }; months.push(by[mk]); }
      var days = [];
      for (var i = 0; i < 7; i++) {
        var dt = t + i * DAY, dd = new Date(dt);
        days.push({ iso: d2s(dt), n: dd.getUTCDate(), inRange: dt >= s && dt <= e, inMonth: dd.getUTCMonth() === by[mk].m });
      }
      by[mk].weeks.push({ key: d2s(t), label: fmtRange(t), days: days });
    }
    return months;
  }

  // ---------- state ----------
  var S = {
    route: { name: "home" }, phase: "loading", phaseMsg: "",
    profile: null, suggestedName: "", email: "", contacts: null, invite: null,
    events: null, ev: null, cal: [], weeks: [],
    draft: { weeks: {}, months: {} }, dirty: false,
    msg: "", msgErr: false, saving: false, menu: false,
    hl: null, sel: null, ex: { mode: "all" }, ask: null, openInvite: false, omenu: false, pfilter: "all", editItem: null, lastDay: 1
  };
  var top = document.getElementById("top"), app = document.getElementById("app"), modalRoot = document.getElementById("modal"), tip = document.getElementById("tip");
  var C = null;
  function signedIn() { return !!(C && C.user); }

  function api(path, method, body) {
    return C.session.getToken().then(function (tok) {
      return fetch(path, {
        method: method || "GET",
        headers: { "content-type": "application/json", authorization: "Bearer " + tok },
        body: body ? JSON.stringify(body) : undefined
      });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error(d.error || "Something went wrong (" + r.status + ")."); e.status = r.status; throw e; }
        return d;
      });
    });
  }
  function act(action, body) {
    return api("/api/event?id=" + encodeURIComponent(S.ev.event.id) + "&action=" + action, "POST", body || {});
  }
  function loadContacts() {
    if (S.contacts) return Promise.resolve(S.contacts);
    return api("/api/contacts").then(function (d) { S.contacts = d.contacts || []; return S.contacts; }, function () { S.contacts = []; return []; });
  }

  // ---------- routing ----------
  var SUBS = ["availability", "group", "settings", "organizer"];
  function parseRoute() {
    var h = location.hash.replace(/^#\/?/, ""), p = h.split("/");
    if (p[0] === "new") return { name: "new" };
    if (p[0] === "account") return { name: "account" };
    if (p[0] === "e" && p[1]) {
      var tab = SUBS.indexOf(p[2]) >= 0 ? p[2] : "overview";
      var sub = tab === "organizer" ? (["schedule", "itinerary", "people"].indexOf(p[3]) >= 0 ? p[3] : "checklist") : null;
      return { name: "event", id: p[1], tab: tab, sub: sub };
    }
    return { name: "home" };
  }
  function nav(h) { if (location.hash === h) go(); else location.hash = h; }
  function go() {
    var prev = S.route;
    S.route = parseRoute(); S.msg = ""; S.msgErr = false; S.menu = false; S.omenu = false; S.ask = null; S.editItem = null; hideTip();
    if (!signedIn()) {
      if (S.route.name === "event" && (!S.invite || S.invite.id !== S.route.id)) {
        fetch("/api/invite?id=" + encodeURIComponent(S.route.id)).then(function (r) { return r.json(); })
          .then(function (d) { S.invite = d.invite ? Object.assign({ id: S.route.id }, d.invite) : null; render(); }, function () {});
      }
      render(); return;
    }
    if (!S.profile) { render(); return; }
    var r = S.route;
    if (r.name === "home") {
      render();
      api("/api/events").then(function (d) { S.events = d.events; render(); }, showErr);
    } else if (r.name === "new") {
      app.innerHTML = ""; render(); mountPicker("new", []); loadContacts();
    } else if (r.name === "event") {
      var same = prev.name === "event" && prev.id === r.id;
      if (!same) { S.ex = { mode: "all" }; S.pfilter = "all"; }
      if (S.ev && S.ev.event && S.ev.event.id === r.id && same) { render(); afterEventRender(); window.scrollTo(0, 0); if (prev.tab !== r.tab || prev.sub !== r.sub) loadEvent(r.id, true); return; }
      S.ev = null; render(); loadEvent(r.id);
    } else render();
  }
  function loadEvent(id, keepDraft) {
    return api("/api/event?id=" + encodeURIComponent(id)).then(function (d) {
      S.ev = d; S.sel = null;
      S.cal = buildCal(d.event.start_date, d.event.end_date);
      S.weeks = []; S.cal.forEach(function (m) { m.weeks.forEach(function (w) { S.weeks.push(w); }); });
      if (!keepDraft) { loadMine(d.mine); S.dirty = false; }
      if (!S.ex.len) S.ex.len = d.event.final_days || d.event.block_min;
      render(); afterEventRender();
    }, function (e) { S.ev = { error: e.message }; render(); });
  }
  function afterEventRender() {
    if (S.openInvite && S.ev && S.ev.me && S.ev.me.can_invite) { S.openInvite = false; openInviteModal(); }
  }
  function showErr(e) { S.msg = e.message || String(e); S.msgErr = true; if (S.route.name === "new") setFormMsg(S.msg, true); else render(); }

  // ---------- top bar ----------
  function topHTML() {
    var h = '<div class="wrap"><a class="brand" href="#/"><i aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b></i>Group Availability</a>';
    if (signedIn() && S.profile) {
      var r = S.route.name;
      h += '<nav class="navlinks" aria-label="Main"><a href="#/" class="' + (r === "home" || r === "event" ? "on" : "") + '">My events</a>' +
        '<a href="#/new" class="hide-sm ' + (r === "new" ? "on" : "") + '">New event</a></nav>';
      var img = C.user.imageUrl && C.user.hasImage !== false ? '<img src="' + esc(C.user.imageUrl) + '" alt="">' : esc(initials(S.profile.name));
      h += '<div class="navright"><button class="avatar" data-act="menu" aria-haspopup="menu" aria-expanded="' + S.menu + '" aria-label="Account menu">' + img + "</button></div>";
      if (S.menu) {
        h += '<div class="menu" role="menu"><div class="who"><b>' + esc(S.profile.name) + "</b><span>" + esc(S.email) + "</span></div>" +
          '<button role="menuitem" data-act="go" data-h="#/">My events</button>' +
          '<button role="menuitem" data-act="go" data-h="#/account">Account settings</button>' +
          '<button role="menuitem" data-act="clerkprofile">Sign-in &amp; security</button>' +
          '<button role="menuitem" data-act="signout">Sign out</button></div>';
      }
    } else if (signedIn()) {
      h += '<div class="navright"><button data-act="signout" class="ghost">Sign out</button></div>';
    } else if (S.phase !== "loading") {
      h += '<div class="navright"><button class="primary" data-act="signin">Sign in</button></div>';
    }
    return h + "</div>";
  }

  // ---------- landing / onboarding / account ----------
  function demoCal() {
    var demo = [["2","c-open"],["3","c-open"],["4","c-busy","1"],["5","c-busy","2"],["6","c-open"],["7","c-all"],["8","c-all"],
      ["9","c-all"],["10","c-all"],["11","c-tent","?1"],["12","c-open"],["13","c-busy","1"],["14","c-open"],["15","c-open"],
      ["16","c-busy","3"],["17","c-busy","2"],["18","c-open"],["19","c-all hl"],["20","c-all hl"],["21","c-all hl"],["22","c-all"]];
    return demo.map(function (x) { return '<span class="sd ' + x[1] + '"><span class="n">' + x[0] + "</span>" + (x[2] ? '<span class="b">' + x[2] + "</span>" : "") + "</span>"; }).join("");
  }
  function landingHTML() {
    var inv = S.route.name === "event" ? S.invite : null, invited = S.route.name === "event";
    var h = '<section class="hero"><div>';
    if (inv) {
      h += '<div class="invitecard"><div class="from">' + esc(inv.organizer || "The organizer") + " invited you to help plan</div>" +
        '<h1 style="font-size:clamp(28px,4.5vw,44px);margin:4px 0 6px">' + esc(inv.title) + "</h1>" +
        '<div class="lbl" style="font-size:14px">' + (inv.final_start ? "Dates: " + esc(fmtSpan(inv.final_start, inv.final_end)) : "Choosing dates between " + esc(fmtSpan(inv.start_date, inv.end_date))) +
        (inv.location ? " · " + esc(inv.location) : "") + "</div>" +
        (inv.invite_message ? "<blockquote>" + esc(inv.invite_message) + "</blockquote>" : "") + "</div>" +
        (inv.description ? '<p style="white-space:pre-line">' + esc(inv.description) + "</p>" : "") +
        '<button class="primary" data-act="signin">Sign in with Google to respond</button>';
    } else if (invited) {
      h += "<h1>You've been invited to <em>plan an event</em>.</h1><p>Sign in with Google to see the details and share when you're free.</p>" +
        '<button class="primary" data-act="signin">Sign in to respond</button>';
    } else {
      h += "<h1>Find the dates that work for <em>everyone</em>.</h1>" +
        "<p>Invite your group, collect availability week by week, and see open days, conflicts and the best stretch for your event, all in one place.</p>" +
        '<button class="primary" data-act="signin">Get started with Google</button>';
    }
    h += '</div><div class="demo" aria-hidden="true"><div class="t"><span>Nov 2026</span><span class="lbl">People busy each day</span></div><div class="sumcal">' + demoCal() + "</div></div></section>";
    if (!invited) {
      h += '<section class="features">' +
        '<div class="card"><h3>Invite and RSVP</h3><p>Send one link. People say whether they plan to come, then share their availability.</p></div>' +
        '<div class="card"><h3>Week by week, or a whole month</h3><p>Mark weeks Free, Busy or Not Sure Yet, or tap the exact days you can make.</p></div>' +
        '<div class="card"><h3>Pick the best window</h3><p>See conflicts per day and the stretches that suit your event length, then set the dates.</p></div>' +
        "</section>";
    }
    return h;
  }
  function onboardingHTML() {
    return '<div class="narrow" style="margin:28px auto 0"><div class="card" style="padding:24px">' +
      "<h1>Welcome! What should we call you?</h1>" +
      '<p class="sub">This is the name other people see in your events. You can change it any time in Account settings.</p>' +
      '<form data-form="profile"><div class="field"><label class="lbl" for="pname">Your name</label>' +
      '<input id="pname" name="name" required maxlength="80" autocomplete="name" value="' + esc(S.suggestedName) + '"></div>' +
      '<button class="primary" type="submit">Continue</button>' + msgHTML() + "</form></div></div>";
  }
  function accountHTML() {
    return '<div class="narrow"><h1>Account settings</h1><p class="sub">Signed in as ' + esc(S.email) + "</p>" +
      '<div class="card"><h2>Profile</h2><form data-form="profile"><div class="field"><label class="lbl" for="pname">Name shown to others</label>' +
      '<input id="pname" name="name" required maxlength="80" value="' + esc(S.profile.name) + '"></div>' +
      '<button class="primary" type="submit">Save name</button>' + msgHTML() + "</form></div>" +
      '<div class="card"><h2>Sign-in &amp; security</h2><p class="msg" style="margin:0 0 12px">Your Google account, email addresses and active sessions.</p>' +
      '<div class="row"><button data-act="clerkprofile">Manage sign-in</button><button data-act="signout" class="ghost">Sign out</button></div></div></div>';
  }
  function msgHTML() { return S.msg ? '<p class="msg' + (S.msgErr ? " err" : " ok") + '" role="status">' + esc(S.msg) + "</p>" : ""; }

  // ---------- length + stage helpers ----------
  function fmtLen(n) { n = +n || 1; return n % 7 === 0 ? (n / 7) + (n === 7 ? " week" : " weeks") : n + (n === 1 ? " day" : " days"); }
  function lenText(e) {
    if (e.final_days) return fmtLen(e.final_days);
    var a = +e.block_min || +e.block_days || 1, b = +e.block_max || a;
    if (a === b) return fmtLen(a);
    if (a % 7 === 0 && b % 7 === 0) return (a / 7) + "–" + (b / 7) + " weeks";
    return a + "–" + b + " days";
  }
  var STEPS = [
    { key: "define", label: "Define the event" },
    { key: "invite", label: "Invite people" },
    { key: "dates", label: "Find possible dates", opt: "availability" },
    { key: "itinerary", label: "Plan the itinerary", opt: "itinerary" },
    { key: "set", label: "Set the dates" }
  ];
  function stepsFor(e) { var st = e.steps || {}; return STEPS.filter(function (s) { return !s.opt || st[s.opt] !== false; }); }
  function stageKey(e) {
    var list = stepsFor(e), k = e.final_start ? "set" : (e.stage || "invite");
    return list.some(function (s) { return s.key === k; }) ? k : "invite";
  }

  // ---------- my availability ----------
  function loadMine(rec) {
    S.draft = { weeks: clone(rec && rec.weeks), months: clone(rec && rec.months) };
    S.cal.forEach(function (m) {
      var mm = S.draft.months[m.key];
      if (mm && mm.s) m.weeks.forEach(function (w) { delete S.draft.weeks[w.key]; });
    });
  }
  function monthSet(mk) { var m = S.draft.months[mk]; return m && m.s ? m : null; }
  function effective(w, mk) {
    var m = monthSet(mk);
    if (m) return { s: m.s, date: m.date, days: (m.days && m.days[w.key]) || [] };
    return S.draft.weeks[w.key] || {};
  }
  function answeredCount() {

        var anyDay = false, mdays = {};
        if (ms.s === "partial") {
          m.weeks.forEach(function (w) { var ds = cleanDays(ms.days && ms.days[w.key]); if (ds.length) { anyDay = true; mdays[w.key] = ds; } });
          if (!anyDay) errs.push("For " + m.label + ", tap at least one day you're free (or choose Busy).");
        }
        if (ms.s === "tentative" && !ms.date) errs.push("For " + m.label + ", pick when you think you will know.");
        months[m.key] = { s: ms.s, date: ms.s === "tentative" ? ms.date : "", days: ms.s === "partial" ? mdays : {} };
      }
      m.weeks.forEach(function (w) {
        var a = effective(w, m.key);

        var ds = a.s === "partial" ? cleanDays(a.days) : [];

          if (a.s === "partial" && !ds.length) errs.push("For the week of " + w.label + ", tap at least one day you're free (or choose Busy).");
          if (a.s === "tentative" && !a.date) errs.push("For the week of " + w.label + ", pick when you think you will know.");

  }
  function refreshEvent(msg, isErr) {
    return loadEvent(S.ev.event.id, true).then(function () { if (msg) { S.msg = msg; S.msgErr = !!isErr; render(); } });
  }
  function copy(text, btn, label) {
    var done = function () {
      if (!btn) return;
      var b = btn.querySelector("b") || btn, t = b.textContent;
      b.textContent = label || "Copied"; setTimeout(function () { b.textContent = t; }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { window.prompt("Copy this:", text); });
    else window.prompt("Copy this:", text);
  }
  function setRsvp(v, knowBy) {
    var e = S.ev.event, was = S.ev.me.rsvp;
    return act("rsvp", { rsvp: v, know_by: knowBy || "" }).then(function () {
      return refreshEvent(v === "no" ? "Got it. The organizer will see that you're not going." : v === "maybe" ? "Noted. Add a date for when you'll know, if you can." : "");
    }).then(function () {
      if (v !== "no" && !was && e.steps.availability && !e.final_start && !S.ev.me.responded) nav("#/e/" + e.id + "/availability");
    }, showErr);
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (S.menu && !(e.target.closest && e.target.closest(".menu, [data-act=menu]"))) { S.menu = false; render(); }
    if (S.omenu && !(e.target.closest && e.target.closest(".menu, [data-act=omenu]"))) { S.omenu = false; render(); }
    if (!b || b.disabled) {
      if (S.sel && !(e.target.closest && e.target.closest(".sd"))) { S.sel = null; hideTip(); render(); }
      return;
    }
    var a = b.getAttribute("data-act");
    if (a === "signin") C.openSignIn({ forceRedirectUrl: location.href, signUpForceRedirectUrl: location.href });
    else if (a === "signout") C.signOut().then(function () { location.hash = "#/"; location.reload(); });
    else if (a === "menu") { S.menu = !S.menu; render(); }
    else if (a === "omenu") { S.omenu = !S.omenu; render(); }
    else if (a === "clerkprofile") { S.menu = false; render(); C.openUserProfile(); }
    else if (a === "go") nav(b.getAttribute("data-h"));
    else if (a === "save") saveResponse();
    else if (a === "day") toggleDay(b);
    else if (a === "ask") { S.ask = b.getAttribute("data-v") || null; render(); }
    else if (a === "copy-link") copy(inviteLink(), b, "Link copied");
    else if (a === "invite") openInviteModal();
    else if (a === "modal-close" || (a === "modal-close-bg" && e.target === b)) closeModal();
    else if (a === "pick-rm") { var k = b.getAttribute("data-k"); PK[k].list = PK[k].list.filter(function (x) { return x !== b.getAttribute("data-e"); }); drawChips(k); }
    else if (a === "pick-focus") { var pin = b.querySelector(".pin"); if (pin && e.target === b) pin.focus(); }
    else if (a === "inv-copy") copy(inviteText(), b, "Invite copied");
    else if (a === "inv-add") {
      var list = PK.invite.list.slice(), m = document.getElementById("imsg"), line = document.getElementById("imsgline");
      b.disabled = true;
      act("invite", { emails: list, message: m ? m.value : undefined }).then(function () {
        PK.invite.list = []; drawChips("invite"); drawInviteActions(list);
        line.className = "msg ok"; line.textContent = "Added " + list.length + (list.length === 1 ? " person" : " people") + ". Now send the invite: Email invite opens your mail app with them in BCC, or Copy invite for a chat.";
        if (m) S.ev.event.invite_message = m.value;
        api("/api/event?id=" + encodeURIComponent(S.ev.event.id)).then(function (d) { S.ev.people = d.people; S.ev.event = d.event; app.innerHTML = eventHTML(); });
      }, function (err) { b.disabled = false; line.className = "msg err"; line.textContent = err.message; });
    }
    else if (a === "rsvp") setRsvp(b.getAttribute("data-v"));
    else if (a === "stage") { var sv = b.getAttribute("data-v"), sl = (STEPS.find(function (x) { return x.key === sv; }) || {}).label; act("stage", { stage: sv }).then(function () { return refreshEvent("Current step: " + sl + "."); }, showErr); }
    else if (a === "ex") { S.ex = { mode: b.getAttribute("data-mode"), month: b.getAttribute("data-m"), from: S.ex.from, to: S.ex.to, len: S.ex.len }; S.hl = null; render(); }
    else if (a === "exlen") { S.ex.len = +b.getAttribute("data-v"); S.hl = null; render(); }
    else if (a === "hl") { var s = b.getAttribute("data-s"), en = b.getAttribute("data-e"); S.hl = S.hl && S.hl.start === s && S.hl.end === en ? null : { start: s, end: en }; render(); }
    else if (a === "sched-set") {
      var ss = b.getAttribute("data-s"), se = b.getAttribute("data-e");
      act("schedule", { final_start: ss, final_end: se }).then(function () { return refreshEvent("Event dates set to " + fmtSpan(ss, se) + ". Everyone will be asked to confirm."); }, showErr);
    }
    else if (a === "sched-clear") act("schedule", { clear: true }).then(function () { return refreshEvent("Back to planning. The dates were cleared."); }, showErr);
    else if (a === "upd-del") act("delete_update", { update_id: b.getAttribute("data-id") }).then(function () { return refreshEvent(); }, showErr);
    else if (a === "itin-edit") { S.editItem = b.getAttribute("data-id"); render(); }
    else if (a === "itin-cancel") { S.editItem = null; render(); }
    else if (a === "itin-del") act("itin_delete", { item_id: b.getAttribute("data-id") }).then(function () { return refreshEvent("Item removed."); }, showErr);
    else if (a === "pfilter") { S.pfilter = b.getAttribute("data-v"); render(); }
    else if (a === "mem-rm") { var em = b.getAttribute("data-email"); S.ask = null; act("member_remove", { email: em }).then(function () { return refreshEvent("Removed " + em + "."); }, showErr); }
    else if (a === "dayinfo") {
      S.sel = S.sel === b.getAttribute("data-iso") ? null : b.getAttribute("data-iso");
      render();
      if (S.sel) { var el = app.querySelector('.sd[data-iso="' + S.sel + '"]'); if (el) showTip(el); } else hideTip();
    }
    else if (a === "delete") api("/api/event?id=" + encodeURIComponent(S.ev.event.id), "DELETE").then(function () { S.ev = null; nav("#/"); }, showErr);
  });

  app.addEventListener("mouseover", function (e) { var el = e.target.closest && e.target.closest(".sd[data-act=dayinfo]"); if (el && !S.sel) showTip(el); });
  app.addEventListener("mouseout", function (e) {
    var el = e.target.closest && e.target.closest(".sd[data-act=dayinfo]");
    if (el && !S.sel && !(e.relatedTarget && el.contains(e.relatedTarget))) hideTip();
  });
  app.addEventListener("focusin", function (e) { if (e.target.matches && e.target.matches(".sd[data-act=dayinfo]")) showTip(e.target); });
  app.addEventListener("focusout", function (e) { if (e.target.matches && e.target.matches(".sd[data-act=dayinfo]") && !S.sel) hideTip(); });
  window.addEventListener("scroll", function () { if (!tip.hidden) hideTip(); S.sel = null; }, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    hideTip(); S.sel = null;
    if (modalRoot.innerHTML) closeModal();
    if (S.menu || S.omenu) { S.menu = false; S.omenu = false; render(); }
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, kind = f.getAttribute("data-form");
    if (kind === "profile") {
      var wasNew = !S.profile;
      api("/api/me", "PUT", { name: f.name.value }).then(function (d) {
        S.profile = d.profile; S.msg = wasNew ? "" : "Saved."; S.msgErr = false;
        if (wasNew) go(); else render();
      }, showErr);
    } else if (kind === "create") {
      var body = readEventForm(f), pin = f.querySelector(".pin");
      if (pin && pin.value.trim()) { var bad = pickAdd("new", pin.value); if (bad.length) { setFormMsg("These don't look like email addresses: " + bad.join(", "), true); return; } pin.value = ""; }
      body.invitees = PK.new ? PK.new.list : [];
      S.saving = true; setFormMsg("");
      api("/api/events", "POST", body).then(function (d) {
        S.saving = false; S.openInvite = true; S.ev = null; app.innerHTML = ""; nav("#/e/" + d.id);
      }, function (err) { S.saving = false; setFormMsg(err.message, true); });
    } else if (kind === "settings") {
      var sb = readEventForm(f);
      S.saving = true;
      api("/api/event?id=" + encodeURIComponent(S.ev.event.id), "PUT", sb).then(function () {
        S.saving = false;
        return loadEvent(S.ev.event.id, true).then(function () { S.ex.len = null; S.msg = "Settings saved."; S.msgErr = false; render(); window.scrollTo(0, 0); });
      }, function (err) { S.saving = false; showErr(err); window.scrollTo(0, 0); });
    } else if (kind === "schedule") {
      act("schedule", { final_start: f.final_start.value, final_end: f.final_end.value })
        .then(function () { return refreshEvent("Event dates saved. Everyone will be asked to confirm."); }, showErr);
    } else if (kind === "update") {
      var text = f.body.value.trim(); if (!text) return;
      act("post_update", { body: text }).then(function () { return refreshEvent(); }, showErr);
    } else if (kind === "itin") {
      var iid = f.getAttribute("data-id"), item = { item_id: iid, day: +f.day.value, time: f.time.value, title: f.title.value, location: f.location.value, notes: f.notes.value };
      S.lastDay = item.day;
      act(iid ? "itin_update" : "itin_add", item).then(function () { S.editItem = null; return refreshEvent(iid ? "Item saved." : "Added to Day " + item.day + "."); }, showErr);
    }
  });

  app.addEventListener("input", function (e) {
    var el = e.target, f = el.getAttribute("data-field");
    if (f !== "date") return;
    var w = el.getAttribute("data-w"), m = el.getAttribute("data-m");
    if (m) { if (S.draft.months[m]) S.draft.months[m].date = el.value; }
    else if (w && S.draft.weeks[w]) S.draft.weeks[w].date = el.value;
    S.dirty = true;
  });
  app.addEventListener("change", function (e) {
    var el = e.target, f = el.getAttribute("data-field");
    if (f === "week") {
      var w = el.getAttribute("data-w"), v = el.value;
      S.cal.forEach(function (m) {
        var M = monthSet(m.key);
        if (!M || !m.weeks.some(function (x) { return x.key === w; })) return;
        m.weeks.forEach(function (x) {
          S.draft.weeks[x.key] = { s: M.s, date: M.s === "tentative" ? (M.date || "") : "", days: M.s === "partial" ? ((M.days && M.days[x.key]) || []).slice() : [] };
        });
        delete S.draft.months[m.key];
      });
      var prev = S.draft.weeks[w] || {};
      if (!v) delete S.draft.weeks[w]; else S.draft.weeks[w] = { s: v, date: prev.date || "", days: prev.days || [] };
      S.dirty = true; S.msg = ""; render();
    } else if (f === "month") {
      var mk = el.getAttribute("data-m"), mv = el.value, pm = S.draft.months[mk] || {};
      if (!mv) delete S.draft.months[mk];
      else {
        S.draft.months[mk] = { s: mv, date: pm.date || "", days: pm.days || {} };
        S.cal.forEach(function (m) { if (m.key === mk) m.weeks.forEach(function (x) { delete S.draft.weeks[x.key]; }); });
      }
      S.dirty = true; S.msg = ""; render();
    } else if (f === "exfrom" || f === "exto") {
      S.ex[f === "exfrom" ? "from" : "to"] = el.value; S.hl = null; render();
    } else if (f === "exlen") {
      S.ex.len = +el.value; S.hl = null; render();
    } else if (f === "rsvp") {
      if (el.value) setRsvp(el.value, el.value === "maybe" ? S.ev.me.know_by : "");
    } else if (f === "knowby") {
      setRsvp("maybe", el.value);
    } else if (f === "role") {
      var email = el.getAttribute("data-email");
      act("member_role", { email: email, role: el.value }).then(function () { return refreshEvent(el.value === "admin" ? "Made " + email + " a co-organizer." : "Changed " + email + " to guest."); }, showErr);
    }
  });
  window.addEventListener("hashchange", function () { if (S.dirty && S.route.tab === "availability") S.dirty = false; closeModal(); go(); });
  window.addEventListener("beforeunload", function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

  // ---------- boot ----------
  function frontendApi(pk) { try { return atob(String(pk).split("_")[2]).replace(/\$$/, ""); } catch (e) { return ""; } }
  function addScript(src, pk) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.async = true; s.crossOrigin = "anonymous";
      if (pk) s.setAttribute("data-clerk-publishable-key", pk);
      s.src = src; s.onload = resolve;
      s.onerror = function () { reject(new Error("Could not load the sign-in service. Check your connection and reload.")); };
      document.head.appendChild(s);
    });
  }
  // Per Clerk's JavaScript quickstart: UI bundle first, then clerk-js, then pass the UI constructor to load().
  function loadClerk(pk) {
    var host = frontendApi(pk);
    if (!host) return Promise.reject(new Error("The sign-in key looks wrong. Check CLERK_PUBLISHABLE_KEY in Vercel."));
    return addScript("https://" + host + "/npm/@clerk/ui@1/dist/ui.browser.js")
      .then(function () { return addScript("https://" + host + "/npm/@clerk/clerk-js@6/dist/clerk.browser.js", pk); });
  }
  function boot() {
    S.route = parseRoute(); render();
    fetch("/api/config").then(function (r) { return r.json(); }).then(function (cfg) {
      if (!cfg.publishableKey) throw new Error("Sign-in isn't set up yet. Missing: " + ((cfg.missing || []).join(", ") || "CLERK_PUBLISHABLE_KEY") + ".");
      return loadClerk(cfg.publishableKey);
    }).then(function () {
      C = window.Clerk;
      return C.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
    }).then(function () {
      var was = !!C.user;
      C.addListener(function (ev) { if (!!(ev && ev.user) !== was) location.reload(); });
      if (!C.user) { S.phase = "ready"; go(); return; }
      S.email = (C.user.primaryEmailAddress && C.user.primaryEmailAddress.emailAddress) || "";
      return api("/api/me").then(function (d) {
        S.profile = d.profile; S.suggestedName = d.suggestedName || C.user.fullName || "";
        S.phase = "ready"; go();
      });
    }).catch(function (e) { S.phase = "error"; S.phaseMsg = e && e.message ? e.message : String(e); render(); });
  }
  boot();
})();
</script>
</body>
</html>
