<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Group Availability</title>
<meta name="description" content="Find the weeks that work for everyone. Invite people, collect availability week by week, and see open days at a glance.">
<style>
/* Layout: sticky top bar, centered content column (wide grid for calendars), cards for grouped content. */
:root{
  --bg:#f5f4ef;--fg:#1c1f23;--muted:#666b73;--line:#d9d6cc;--card:#ffffff;--soft:#ecebe4;
  --accent:#1f4d3a;--accent-fg:#ffffff;
  --open:#2e7d4f;--tent:#2d6aa8;--na:#c2413b;--none:#cfccc3;--focus:#1f4d3a;
  --shadow:0 8px 24px rgba(20,24,28,.14);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#ecebe6;--muted:#9ca1a9;--line:#2c3035;--card:#1d2024;--soft:#24282d;--accent:#86c9a6;--accent-fg:#10231a;--open:#5cb882;--tent:#6aa8e6;--na:#e0645c;--none:#3b3f45;--focus:#86c9a6;--shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#ecebe6;--muted:#9ca1a9;--line:#2c3035;--card:#1d2024;--soft:#24282d;--accent:#86c9a6;--accent-fg:#10231a;--open:#5cb882;--tent:#6aa8e6;--na:#e0645c;--none:#3b3f45;--focus:#86c9a6;--shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1{font-size:24px;margin:0 0 4px;text-wrap:balance;font-weight:650}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:20px 40px;min-width:0}
.narrow{max-width:720px}
.sub{color:var(--muted);margin:0 0 14px}
.lbl{font-size:12px;color:var(--muted)}
.msg{color:var(--muted);font-size:13px;margin:6px 0 0}
.err{color:var(--na)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}

/* controls */
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.ghost{background:transparent}
.danger{color:var(--na);border-color:color-mix(in srgb,var(--na) 50%,var(--line))}
button.link{background:none;border:none;padding:0;min-height:0;color:var(--accent);text-decoration:underline;font-size:13px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
select{padding:4px 8px;min-height:32px}
select:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:auto;min-height:0;margin-top:3px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--card)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--fg);text-decoration:none;font-size:16px;white-space:nowrap}
.brand i{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand i b{width:7px;height:7px;border-radius:2px;background:var(--open)}
.brand i b:nth-child(2),.brand i b:nth-child(6){background:var(--na)}
.brand i b:nth-child(4){background:var(--tent)}
.navlinks{display:flex;gap:4px;flex:1;min-width:0}
.navlinks a{padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
.navlinks a.on{color:var(--fg);background:var(--soft);font-weight:600}
.navright{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;padding:0;min-height:0;overflow:hidden;display:grid;place-items:center;background:var(--soft);font-weight:600;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:60px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:30}
.menu .who{padding:10px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.menu .who span{font-size:12px;color:var(--muted);word-break:break-all}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:8px}
.menu button:hover{background:var(--soft)}
@media (max-width:560px){.navlinks a.hide-sm,.hide-sm{display:none}}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.02em;margin-bottom:14px}
.hero p{font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 22px}
.hero .primary{font-size:16px;padding:12px 20px}
.demo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.demo .t{font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
.demo .g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.demo .g .sd{aspect-ratio:1;min-height:0}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;padding-block:8px 24px}
.features .card h3{margin:0 0 4px;font-size:15px}
.features .card p{margin:0;color:var(--muted);font-size:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:24px;padding-top:24px}}

/* home list */
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
a.ev{display:grid;gap:8px;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
a.ev:hover{border-color:var(--accent)}
a.ev h3{margin:0;font-size:16px}
a.ev .meta{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.go{background:color-mix(in srgb,var(--open) 18%,var(--card));color:var(--fg)}
.chip.todo{background:color-mix(in srgb,var(--na) 16%,var(--card));color:var(--fg)}
.empty{text-align:center;padding:40px 16px}

/* event page */
.crumb{font-size:13px;margin-bottom:8px;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0}
.tabs a{padding:10px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;white-space:nowrap}
.tabs a.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.share input{flex:1;min-width:0;font-size:13px}

/* status colors */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend i.st-open{background:var(--open)}
.legend i.st-partial{background:linear-gradient(135deg,var(--open) 50%,var(--na) 50%)}
.legend i.st-tentative{background:repeating-linear-gradient(45deg,var(--tent) 0 3px,color-mix(in srgb,var(--tent) 25%,var(--card)) 3px 6px)}
.legend i.st-na{background:var(--na)}
.legend i.st-none{background:var(--none)}

/* month cards (respond + summary) */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px;align-items:stretch}
.months>.card{margin-bottom:0}
.mhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead h2{margin:0;line-height:32px}
.mset{display:flex;align-items:center;gap:8px;margin:0}
.mset .lbl{white-space:nowrap}
.mset select{width:auto;min-width:140px}
.mdetail{display:grid;gap:4px;margin:0 0 12px}
.cal{display:grid;grid-template-columns:52px minmax(96px,128px) repeat(7,minmax(0,1fr));gap:6px 4px;align-items:start}
.hd{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:16px}
.hd.l{text-align:left}
.hd .sm{display:none}
@media (max-width:520px){.hd .lg{display:none}.hd .sm{display:inline}}
.wk{font-size:13px;font-weight:600;line-height:32px;white-space:nowrap}
.ws select{font-size:13px}
.d{height:32px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;border:1px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}
.d.out{opacity:.4}
.d.off{opacity:.18;background:transparent!important;border-style:dotted!important}
.d.st-none{background:color-mix(in srgb,var(--none) 60%,var(--card));border-color:var(--none)}
.d.st-open{background:color-mix(in srgb,var(--open) 35%,var(--card));border-color:color-mix(in srgb,var(--open) 60%,var(--card))}
.d.st-tentative{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--tent) 45%,var(--card)) 0 4px,color-mix(in srgb,var(--tent) 12%,var(--card)) 4px 8px);border-color:color-mix(in srgb,var(--tent) 60%,var(--card))}
.d.st-na{background:color-mix(in srgb,var(--na) 35%,var(--card));border-color:color-mix(in srgb,var(--na) 60%,var(--card))}
.d.st-partial{background:color-mix(in srgb,var(--na) 30%,var(--card));border:1.5px dashed var(--na)}
.d.st-partial.pk{background:color-mix(in srgb,var(--open) 38%,var(--card));border:1.5px dashed var(--open);font-weight:600}
.cal button.d{min-height:0;padding:0;font-size:11px;cursor:pointer;color:var(--fg)}
.cal button.d.tap{height:36px}
.hint{grid-column:3 / -1;font-size:11px;color:var(--muted);margin-top:-4px}
.wdetail{grid-column:2 / -1;display:grid;gap:4px}
.tdate{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tdate input{width:auto;max-width:170px;min-height:32px;padding:4px 8px;font-size:13px}
.save{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;z-index:5}

/* summary calendar */
.sumcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sd{position:relative;min-height:46px;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:4px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--fg);font-size:12px;min-width:0}
.sd .n{font-weight:600}
.sd .b{align-self:flex-end;font-size:12px;font-weight:700;line-height:1}
.sd.blank{visibility:hidden}
.sd.out{opacity:.55}
.sd.c-none{background:color-mix(in srgb,var(--none) 50%,var(--card))}
.sd.c-open{background:color-mix(in srgb,var(--open) 30%,var(--card));border-color:color-mix(in srgb,var(--open) 55%,var(--card))}
.sd.c-all{background:color-mix(in srgb,var(--open) 55%,var(--card));border-color:var(--open)}
.sd.c-tent{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--tent) 40%,var(--card)) 0 4px,color-mix(in srgb,var(--tent) 10%,var(--card)) 4px 8px);border-color:color-mix(in srgb,var(--tent) 55%,var(--card))}
.sd.c-busy{background:color-mix(in srgb,var(--na) var(--lv,35%),var(--card));border-color:color-mix(in srgb,var(--na) 60%,var(--card))}
.sd.hl{outline:3px solid var(--fg);outline-offset:1px;z-index:1}
.sd.sel{outline:2px solid var(--accent);outline-offset:1px}
.tip{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;max-width:280px;font-size:13px;pointer-events:none}
.tip h4{margin:0 0 6px;font-size:13px}
.tip .grp{margin-top:6px}
.tip .grp b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tip .grp div{margin-top:2px}
.windows{display:grid;gap:8px}
.win{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;text-align:left;width:100%}
.win[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.win .r{font-weight:600}
.win .s{font-size:13px;color:var(--muted)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px}
.people span.me{border-color:var(--accent);font-weight:600}
.people span.pend{border-style:dashed;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){a.ev,.sd{transition:border-color .15s}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="app"></main>
<div class="tip" id="tip" hidden></div>
<script>
(function () {
  "use strict";
  // ---------- constants & date helpers ----------
  var STATUS = [["open", "Free"], ["partial", "Set days"], ["tentative", "Not Sure Yet"], ["na", "Busy"]];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var ST_CLS = { open: "st-open", partial: "st-partial", tentative: "st-tentative", na: "st-na" };
  var DAY = 864e5;

  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function d2s(t) { var d = new Date(t); return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()); }
  function ts(key) { var p = key.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmtRange(t) {
    var a = new Date(t), b = new Date(t + 6 * DAY);
    return MON[a.getUTCMonth()] + " " + a.getUTCDate() + " – " + (a.getUTCMonth() === b.getUTCMonth() ? "" : MON[b.getUTCMonth()] + " ") + b.getUTCDate();
  }
  function fmtDate(iso, withDow) {
    if (!iso) return "";
    var d = new Date(ts(iso));
    return (withDow ? DOW[(d.getUTCDay() + 6) % 7] + ", " : "") + MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
  }
  function fmtShort(iso) { var d = new Date(ts(iso)); return DOW[(d.getUTCDay() + 6) % 7] + " " + MON[d.getUTCMonth()] + " " + d.getUTCDate(); }
  function fmtSpan(a, b) { return fmtDate(a) + " – " + fmtDate(b); }
  function fmtBlockAdj(n) { n = +n || 1; return n % 7 === 0 ? (n / 7) + "-week" : n + "-day"; }
  function fmtBlock(n) { n = +n || 1; return n % 7 === 0 ? (n / 7) + (n === 7 ? " week" : " weeks") : n + (n === 1 ? " day" : " days"); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
  function cleanDays(a) {
    var out = [];
    (a || []).forEach(function (i) { i = +i; if (i >= 0 && i < 7 && out.indexOf(i) < 0) out.push(i); });
    return out.sort();
  }

  // Weeks (Mon–Sun) covering [start, end]. A week belongs to the month of its Thursday,
  // or of its first in-range day when that Thursday falls outside the range.
  function buildCal(start, end) {
    var s = ts(start), e = ts(end), dow = (new Date(s).getUTCDay() + 6) % 7;
    var months = [], by = {};
    for (var t = s - dow * DAY; t <= e; t += 7 * DAY) {
      var thu = t + 3 * DAY, anchor = thu;
      if (thu < s || thu > e) anchor = Math.max(t, s);
      var ad = new Date(anchor), mk = ad.getUTCFullYear() + "-" + p2(ad.getUTCMonth() + 1);
      if (!by[mk]) { by[mk] = { key: mk, label: MON[ad.getUTCMonth()] + " " + ad.getUTCFullYear(), m: ad.getUTCMonth(), weeks: [] }; months.push(by[mk]); }
      var days = [];
      for (var i = 0; i < 7; i++) {
        var dt = t + i * DAY, dd = new Date(dt);
        days.push({ iso: d2s(dt), n: dd.getUTCDate(), inRange: dt >= s && dt <= e, inMonth: dd.getUTCMonth() === by[mk].m });
      }
      by[mk].weeks.push({ key: d2s(t), label: fmtRange(t), days: days });
    }
    return months;
  }

  // ---------- app state ----------
  var S = {
    route: { name: "home" }, phase: "loading", phaseMsg: "",
    profile: null, suggestedName: "", email: "",
    events: null, ev: null, cal: [], weeks: [],
    draft: { weeks: {}, months: {} }, dirty: false,
    msg: "", msgErr: false, saving: false, menu: false,
    hl: null, sel: null, delConfirm: false
  };
  var top = document.getElementById("top"), app = document.getElementById("app"), tip = document.getElementById("tip");
  var C = null; // Clerk

  function signedIn() { return !!(C && C.user); }

  function api(path, method, body) {
    return C.session.getToken().then(function (tok) {
      return fetch(path, {
        method: method || "GET",
        headers: { "content-type": "application/json", authorization: "Bearer " + tok },
        body: body ? JSON.stringify(body) : undefined
      });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error(d.error || "Something went wrong (" + r.status + ")."); e.status = r.status; throw e; }
        return d;
      });
    });
  }

  // ---------- routing ----------
  function parseRoute() {
    var h = location.hash.replace(/^#\/?/, ""), p = h.split("/");
    if (p[0] === "new") return { name: "new" };
    if (p[0] === "account") return { name: "account" };
    if (p[0] === "e" && p[1]) return { name: "event", id: p[1], tab: ["summary", "edit"].indexOf(p[2]) >= 0 ? p[2] : "respond" };
    return { name: "home" };
  }
  function nav(h) { if (location.hash === h) go(); else location.hash = h; }

  function go() {
    S.route = parseRoute(); S.msg = ""; S.msgErr = false; S.menu = false; S.delConfirm = false; hideTip();
    if (!signedIn() || !S.profile) { render(); return; }
    var r = S.route;
    if (r.name === "home") {
      render();
      api("/api/events").then(function (d) { S.events = d.events; render(); }, showErr);
    } else if (r.name === "event") {
      if (S.ev && S.ev.event.id === r.id) { render(); return; }
      S.ev = null; render();
      loadEvent(r.id);
    } else render();
  }
  function loadEvent(id) {
    return api("/api/event?id=" + encodeURIComponent(id)).then(function (d) {
      S.ev = d; S.hl = null; S.sel = null;
      S.cal = buildCal(d.event.start_date, d.event.end_date);
      S.weeks = []; S.cal.forEach(function (m) { m.weeks.forEach(function (w) { S.weeks.push(w); }); });
      loadMine(d.mine); S.dirty = false;
      render();
    }, function (e) { S.ev = { error: e.message }; render(); });
  }
  function showErr(e) { S.msg = e.message || String(e); S.msgErr = true; render(); }

  // ---------- top bar ----------
  function initials(n) { return String(n || "?").trim().split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join("").toUpperCase() || "?"; }
  function topHTML() {
    var h = '<div class="wrap"><a class="brand" href="#/"><i aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b></i>Group Availability</a>';
    if (signedIn() && S.profile) {
      var r = S.route.name;
      h += '<nav class="navlinks" aria-label="Main"><a href="#/" class="' + (r === "home" || r === "event" ? "on" : "") + '">My events</a>' +
        '<a href="#/new" class="hide-sm ' + (r === "new" ? "on" : "") + '">New event</a></nav>';

  // ----- summary -----
  function stateOn(person, wkKey, di) {
    var a = person.weeks && person.weeks[wkKey];
    if (!a || !a.s) return "none";
    if (a.s === "open") return "free";
    if (a.s === "na") return "busy";
    if (a.s === "tentative") return "tent";
    if (a.s === "partial") return (a.days || []).indexOf(di) >= 0 ? "free" : "busy";
    return "none";
  }
  function dayStats(wkKey, di) {
    var st = { free: [], busy: [], tent: [], none: [] };
    S.ev.people.forEach(function (p) {
      var s = p.responded ? stateOn(p, wkKey, di) : "none";
      st[s].push(p);
    });
    return st;
  }
  function inRangeDays() {
    var out = [];
    S.weeks.forEach(function (w) { w.days.forEach(function (d, di) { if (d.inRange) out.push({ iso: d.iso, w: w.key, i: di }); }); });
    out.sort(function (a, b) { return a.iso < b.iso ? -1 : 1; });
    return out;
  }
  function bestWindows() {
    var days = inRangeDays(), L = Math.max(1, +S.ev.event.block_days || 1);
    var resp = S.ev.people.filter(function (p) { return p.responded; });
    if (!resp.length || days.length < L) return [];
    var cand = [];
    for (var i = 0; i + L <= days.length; i++) {
      var busy = {}, tent = {}, unk = {};
      for (var j = i; j < i + L; j++) {
        resp.forEach(function (p) {
          var s = stateOn(p, days[j].w, days[j].i);
          if (s === "busy") busy[p.id] = p; else if (s === "tent") tent[p.id] = p; else if (s === "none") unk[p.id] = p;
        });
      }
      Object.keys(busy).forEach(function (k) { delete tent[k]; delete unk[k]; });
      Object.keys(tent).forEach(function (k) { delete unk[k]; });
      var vals = function (o) { return Object.keys(o).map(function (k) { return o[k]; }); };
      cand.push({ start: days[i].iso, end: days[i + L - 1].iso, si: i, busy: vals(busy), tent: vals(tent), unk: vals(unk) });
    }
    cand.sort(function (a, b) { return (a.busy.length + a.unk.length) - (b.busy.length + b.unk.length) || a.busy.length - b.busy.length || a.tent.length - b.tent.length || a.si - b.si; });
    var picked = [];
    for (var k = 0; k < cand.length && picked.length < 3; k++) {
      var c = cand[k];
      if (picked.some(function (p) { return Math.abs(p.si - c.si) < L; })) continue;
      picked.push(c);
    }
    return picked;
  }
  function names(list) { return list.map(function (p) { return esc(p.name); }).join(", "); }
  function summaryHTML() {
    var people = S.ev.people, resp = people.filter(function (p) { return p.responded; });

      }).join("") + "</div></div>";
    h += '<div class="card" style="margin:0"><h2>Best ' + esc(fmtBlockAdj(e.block_days)) + " windows</h2>";
    var wins = bestWindows();
    if (!resp.length) h += '<p class="msg" style="margin:0">Windows appear once people respond.</p>';

    else {

        var on = S.hl && S.hl.start === w.start;
        var parts = [];
        if (w.busy.length) parts.push(w.busy.length + " with conflicts: " + names(w.busy));
        if (w.tent.length) parts.push(w.tent.length + " not sure: " + names(w.tent));
        if (w.unk.length) parts.push(w.unk.length + " haven't answered these days: " + names(w.unk));

        return '<button class="win" data-act="hl" data-s="' + w.start + '" data-e="' + w.end + '" aria-pressed="' + !!on + '"><span class="r">' +
          esc(fmtShort(w.start)) + " – " + esc(fmtShort(w.end)) + '</span><span class="s">' + s + "</span></button>";
      }).join("") + "</div>" + (pending.length ? '<p class="msg">Not counting ' + pending.length + " who haven't responded.</p>" : "");
    }
    h += "</div></div>";
    h += '<div class="legend"><span><i style="background:color-mix(in srgb,var(--open) 55%,var(--card))"></i>Everyone free</span>' +
      '<span><i style="background:color-mix(in srgb,var(--open) 30%,var(--card))"></i>No conflicts yet</span>' +
      '<span><i class="st-na"></i>Conflicts (number = people busy)</span><span><i class="st-tentative"></i>Someone not sure</span>' +
      '<span><i class="st-none"></i>No responses</span><span>Hover or tap a day for details</span></div>';
    h += '<div class="months">';
    S.cal.forEach(function (m) {
      h += '<section class="card"><div class="mhead"><h2>' + esc(m.label) + '</h2></div><div class="sumcal">' +
        DOW.map(function (d) { return '<div class="hd"><span class="lg">' + d + '</span><span class="sm">' + d.charAt(0) + "</span></div>"; }).join("");
      m.weeks.forEach(function (w) {
        w.days.forEach(function (d, di) {

          var st = dayStats(w.key, di), R = st.free.length + st.busy.length + st.tent.length;
          var cls = "c-none", badge = "", style = "";
          if (!R) cls = "c-none";
          else if (st.busy.length) { cls = "c-busy"; badge = String(st.busy.length); style = ' style="--lv:' + Math.round(25 + 45 * st.busy.length / Math.max(R, 1)) + '%"'; }
          else if (st.tent.length) { cls = "c-tent"; badge = "?" + st.tent.length; }
          else cls = st.none.length ? "c-open" : "c-all";
          var hl = S.hl && d.iso >= S.hl.start && d.iso <= S.hl.end ? " hl" : "";
          var sel = S.sel === d.iso ? " sel" : "";
          var label = fmtShort(d.iso) + ": " + (R ? st.busy.length + " busy, " + st.tent.length + " not sure, " + st.free.length + " free" : "no responses");
          h += '<button class="sd ' + cls + (d.inMonth ? "" : " out") + hl + sel + '"' + style + ' data-act="dayinfo" data-w="' + w.key + '" data-i="' + di + '" data-iso="' + d.iso + '" aria-label="' + esc(label) + '">' +
            '<span class="n">' + d.n + "</span>" + (badge ? '<span class="b">' + badge + "</span>" : "") + "</button>";
        });
      });
      h += "</div></section>";
    });
    return h + "</div>";
  }

  // ----- tooltip -----
  function tipHTML(wk, di, iso) {
    var st = dayStats(wk, di), w = S.ev.people;
    var grp = function (title, list, extra) {
      if (!list.length) return "";
      return '<div class="grp"><b>' + title + " (" + list.length + ")</b><div>" + list.map(function (p) { return esc(p.name) + (extra ? extra(p) : ""); }).join("<br>") + "</div></div>";
    };
    var tentNote = function (p) { var a = p.weeks[wk]; return a && a.date ? ' <span class="lbl">· knows by ' + esc(fmtDate(a.date)) + "</span>" : ""; };
    return "<h4>" + esc(fmtDate(iso, true)) + "</h4>" +
      grp("Busy", st.busy) + grp("Not sure yet", st.tent, tentNote) + grp("Free", st.free) + grp("No response", st.none) +
      (w.length ? "" : '<div class="lbl">Nobody invited yet.</div>');
  }
  function showTip(el) {
    tip.innerHTML = tipHTML(el.getAttribute("data-w"), +el.getAttribute("data-i"), el.getAttribute("data-iso"));
    tip.hidden = false;
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
    var y = r.bottom + 8; if (y + th > window.innerHeight - 8) y = Math.max(8, r.top - th - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.hidden = true; }

  // ---------- render ----------
  function render() {
    top.innerHTML = topHTML();
    var h;
    if (S.phase === "loading") h = '<p class="msg">Loading…</p>';
    else if (S.phase === "error") h = '<div class="card narrow"><h2>Something went wrong</h2><p class="msg err">' + esc(S.phaseMsg) + "</p></div>";
    else if (!signedIn()) h = landingHTML();
    else if (!S.profile) h = onboardingHTML();
    else {
      var r = S.route.name;
      h = r === "new" ? formHTML(null) : r === "account" ? accountHTML() : r === "event" ? eventHTML() : homeHTML();
    }
    app.innerHTML = h;
  }

  // ---------- actions ----------
  function readEventForm(f) {
    var amt = Math.max(1, Math.round(+f.block_amt.value || 1));
    return {
      title: f.title.value, description: f.description.value,
      start_date: f.start_date.value, end_date: f.end_date.value,
      block_days: f.block_unit.value === "weeks" ? amt * 7 : amt,
      invitees: f.invitees.value, open_join: f.open_join.checked
    };
  }
  function saveResponse() {
    var errs = [], months = {}, weeks = {};
    S.cal.forEach(function (m) {
      var ms = monthSet(m.key);
      if (ms) {
        var anyDay = false, mdays = {};
        if (ms.s === "partial") {
          m.weeks.forEach(function (w) { var ds = cleanDays(ms.days && ms.days[w.key]); if (ds.length) { anyDay = true; mdays[w.key] = ds; } });
          if (!anyDay) errs.push("For " + m.label + ", tap at least one day you're free (or choose Busy).");
        }
        if (ms.s === "tentative" && !ms.date) errs.push("For " + m.label + ", pick when you think you will know.");
        months[m.key] = { s: ms.s, date: ms.s === "tentative" ? ms.date : "", days: ms.s === "partial" ? mdays : {} };
      }
      m.weeks.forEach(function (w) {
        var a = effective(w, m.key);
        if (!a || !a.s) return;
        var ds = a.s === "partial" ? cleanDays(a.days) : [];
        if (!ms) {
          if (a.s === "partial" && !ds.length) errs.push("For the week of " + w.label + ", tap at least one day you're free (or choose Busy).");
          if (a.s === "tentative" && !a.date) errs.push("For the week of " + w.label + ", pick when you think you will know.");
        }
        weeks[w.key] = { s: a.s, date: a.s === "tentative" ? a.date : "", days: ds };
      });
    });
    if (errs.length) { S.msg = errs[0] + (errs.length > 1 ? " (" + (errs.length - 1) + " more to fix.)" : ""); S.msgErr = true; render(); return; }
    S.saving = true; S.msg = ""; render();
    var id = S.ev.event.id;
    api("/api/response?id=" + encodeURIComponent(id), "PUT", { weeks: weeks, months: months })
      .then(function () { return loadEvent(id); })
      .then(function () { S.saving = false; S.msg = "Saved."; S.msgErr = false; render(); },
            function (e) { S.saving = false; showErr(e); });
  }
  function toggleDay(b) {
    var w = b.getAttribute("data-w"), i = +b.getAttribute("data-i"), mk = b.getAttribute("data-m"), cur;
    if (mk) {
      var M = S.draft.months[mk]; if (!M) return; M.days = M.days || {};
      cur = (M.days[w] || []).slice(); var at = cur.indexOf(i); if (at >= 0) cur.splice(at, 1); else cur.push(i); M.days[w] = cleanDays(cur);
    } else {
      var W = S.draft.weeks[w]; if (!W) return;
      cur = (W.days || []).slice(); var at2 = cur.indexOf(i); if (at2 >= 0) cur.splice(at2, 1); else cur.push(i); W.days = cleanDays(cur);
    }
    S.dirty = true; S.msg = ""; render();
    var again = app.querySelector('button[data-act="day"][data-w="' + w + '"][data-i="' + i + '"]');
    if (again) again.focus();
  }
  function openSignIn() {
    C.openSignIn({ forceRedirectUrl: location.href, signUpForceRedirectUrl: location.href });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (S.menu && !(e.target.closest && e.target.closest(".menu, [data-act=menu]"))) { S.menu = false; render(); }
    if (!b || b.disabled) {
      if (!(e.target.closest && e.target.closest(".sd"))) { if (S.sel) { S.sel = null; hideTip(); render(); } }
      return;
    }
    var act = b.getAttribute("data-act");
    if (act === "signin") openSignIn();
    else if (act === "signout") C.signOut().then(function () { location.hash = "#/"; location.reload(); });
    else if (act === "menu") { S.menu = !S.menu; render(); }
    else if (act === "clerkprofile") { S.menu = false; render(); C.openUserProfile(); }
    else if (act === "go") nav(b.getAttribute("data-h"));
    else if (act === "save") saveResponse();
    else if (act === "day") toggleDay(b);
    else if (act === "copy") {
      var inp = document.getElementById("sharelink"), done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy invite link"; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done, function () { inp.select(); });
      else inp.select();
    } else if (act === "hl") {
      var s = b.getAttribute("data-s");
      S.hl = S.hl && S.hl.start === s ? null : { start: s, end: b.getAttribute("data-e") }; render();
    } else if (act === "dayinfo") {
      S.sel = S.sel === b.getAttribute("data-iso") ? null : b.getAttribute("data-iso");
      render();
      if (S.sel) { var el = app.querySelector('.sd[data-iso="' + S.sel + '"]'); if (el) showTip(el); } else hideTip();
    } else if (act === "delask") { S.delConfirm = true; render(); }
    else if (act === "delcancel") { S.delConfirm = false; render(); }
    else if (act === "delete") {
      api("/api/event?id=" + encodeURIComponent(S.ev.event.id), "DELETE").then(function () { S.ev = null; nav("#/"); }, showErr);
    }
  });

  app.addEventListener("mouseover", function (e) {
    var el = e.target.closest && e.target.closest(".sd[data-act=dayinfo]");
    if (el && !S.sel) showTip(el);
  });
  app.addEventListener("mouseout", function (e) {
    var el = e.target.closest && e.target.closest(".sd[data-act=dayinfo]");
    if (el && !S.sel && !(e.relatedTarget && el.contains(e.relatedTarget))) hideTip();
  });
  app.addEventListener("focusin", function (e) { if (e.target.matches && e.target.matches(".sd[data-act=dayinfo]")) showTip(e.target); });
  app.addEventListener("focusout", function (e) { if (e.target.matches && e.target.matches(".sd[data-act=dayinfo]") && !S.sel) hideTip(); });
  window.addEventListener("scroll", function () { if (!tip.hidden) hideTip(); S.sel = null; }, { passive: true });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { hideTip(); S.sel = null; if (S.menu) { S.menu = false; render(); } } });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, kind = f.getAttribute("data-form");
    if (kind === "profile") {
      var wasNew = !S.profile;
      api("/api/me", "PUT", { name: f.name.value }).then(function (d) {
        S.profile = d.profile; S.msg = wasNew ? "" : "Saved."; S.msgErr = false;
        if (wasNew) go(); else render();
      }, showErr);
    } else if (kind === "event") {
      var body = readEventForm(f), editing = S.route.name === "event";
      S.saving = true; S.msg = ""; render();
      var req = editing ? api("/api/event?id=" + encodeURIComponent(S.ev.event.id), "PUT", body) : api("/api/events", "POST", body);
      req.then(function (d) {
        S.saving = false;
        var id = editing ? S.ev.event.id : d.id;
        S.ev = null; nav("#/e/" + id);
      }, function (err) {
        S.saving = false; showErr(err);
        // keep what they typed
        var f2 = app.querySelector("form[data-form=event]");
        if (f2) { f2.title.value = body.title; f2.description.value = body.description; f2.start_date.value = body.start_date; f2.end_date.value = body.end_date; f2.invitees.value = body.invitees; f2.open_join.checked = body.open_join; }
      });
    }
  });

  app.addEventListener("input", function (e) {
    var el = e.target, f = el.getAttribute("data-field");
    if (f !== "date") return;
    var w = el.getAttribute("data-w"), m = el.getAttribute("data-m");
    if (m) { if (S.draft.months[m]) S.draft.months[m].date = el.value; }
    else if (w && S.draft.weeks[w]) S.draft.weeks[w].date = el.value;
    S.dirty = true;
  });
  app.addEventListener("change", function (e) {
    var el = e.target, f = el.getAttribute("data-field");
    if (f === "week") {
      var w = el.getAttribute("data-w"), v = el.value;
      S.cal.forEach(function (m) {
        var M = monthSet(m.key);
        if (!M || !m.weeks.some(function (x) { return x.key === w; })) return;
        m.weeks.forEach(function (x) {
          S.draft.weeks[x.key] = { s: M.s, date: M.s === "tentative" ? (M.date || "") : "", days: M.s === "partial" ? ((M.days && M.days[x.key]) || []).slice() : [] };
        });
        delete S.draft.months[m.key];
      });
      var prev = S.draft.weeks[w] || {};
      if (!v) delete S.draft.weeks[w];
      else S.draft.weeks[w] = { s: v, date: prev.date || "", days: prev.days || [] };
      S.dirty = true; S.msg = ""; render();
    } else if (f === "month") {
      var mk = el.getAttribute("data-m"), mv = el.value, pm = S.draft.months[mk] || {};
      if (!mv) delete S.draft.months[mk];
      else {
        S.draft.months[mk] = { s: mv, date: pm.date || "", days: pm.days || {} };
        S.cal.forEach(function (m) { if (m.key === mk) m.weeks.forEach(function (x) { delete S.draft.weeks[x.key]; }); });
      }
      S.dirty = true; S.msg = ""; render();
    }
  });
  window.addEventListener("hashchange", function () {
    if (S.dirty && S.route.name === "event" && S.route.tab === "respond") S.dirty = false;
    go();
  });
  window.addEventListener("beforeunload", function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

  // ---------- boot ----------
  function frontendApi(pk) { try { return atob(String(pk).split("_")[2]).replace(/\$$/, ""); } catch (e) { return ""; } }
  function addScript(src, pk) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.async = true; s.crossOrigin = "anonymous";
      if (pk) s.setAttribute("data-clerk-publishable-key", pk);
      s.src = src; s.onload = resolve;
      s.onerror = function () { reject(new Error("Could not load the sign-in service. Check your connection and reload.")); };
      document.head.appendChild(s);
    });
  }
  // Per Clerk's JavaScript quickstart: UI bundle first, then clerk-js, then pass the UI constructor to load().
  function loadClerk(pk) {
    var host = frontendApi(pk);
    if (!host) return Promise.reject(new Error("The sign-in key looks wrong. Check CLERK_PUBLISHABLE_KEY in Vercel."));
    return addScript("https://" + host + "/npm/@clerk/ui@1/dist/ui.browser.js")
      .then(function () { return addScript("https://" + host + "/npm/@clerk/clerk-js@6/dist/clerk.browser.js", pk); });
  }

  function boot() {
    S.route = parseRoute(); render();
    fetch("/api/config").then(function (r) { return r.json(); }).then(function (cfg) {
      if (!cfg.publishableKey) throw new Error("Sign-in isn't set up yet. Missing: " + ((cfg.missing || []).join(", ") || "CLERK_PUBLISHABLE_KEY") + ".");
      return loadClerk(cfg.publishableKey);
    }).then(function () {
      C = window.Clerk;
      return C.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
    }).then(function () {
      var was = !!C.user;
      C.addListener(function (ev) { if (!!(ev && ev.user) !== was) location.reload(); });
      if (!C.user) { S.phase = "ready"; render(); return; }
      S.email = (C.user.primaryEmailAddress && C.user.primaryEmailAddress.emailAddress) || "";
      return api("/api/me").then(function (d) {
        S.profile = d.profile; S.suggestedName = d.suggestedName || C.user.fullName || "";
        S.phase = "ready"; go();
      });
    }).catch(function (e) { S.phase = "error"; S.phaseMsg = e && e.message ? e.message : String(e); render(); });
  }
  boot();
})();
</script>
</body>
</html>
